[config]
model="openai/test-pr-combo"
fallback_models = ["openai/cx/gpt-5.5-review", "openai/cx/gpt-5.4-review"]
custom_model_max_tokens = 4000
max_model_tokens = 4000

[pr_reviewer]
extra_instructions="""
IMPORTANT:
- Toàn bộ phản hồi PHẢI bằng tiếng Việt.
- Không dùng tiếng Anh, trừ tên hàm, tên biến, tên file, keyword code.
- Chỉ tập trung bug, security, edge case, code smell nghiêm trọng.
- Không comment style hoặc format.
"""

[pr_code_suggestions]
extra_instructions="""
IMPORTANT:
- Tất cả inline comment và code suggestion PHẢI bằng tiếng Việt.
- Chỉ comment vào dòng có bug/rủi ro thật sự.
- Ưu tiên security, runtime error, edge case.
"""
num_code_suggestions=8
suggestions_score_threshold=4